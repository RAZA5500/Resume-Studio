<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>ResumeStudio — AI Resume Builder, ATS Checker & PDF Editor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Build ATS-friendly resumes with AI, choose from 4,600+ professional templates, check your ATS score and edit PDFs, images and Word documents online. Free daily plan, lifetime access for PKR 99.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07060e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ResumeStudio">
  <meta property="og:title" content="ResumeStudio — AI Resume Builder, ATS Checker & PDF Editor">
  <meta property="og:description" content="4,608 ATS-friendly templates, an AI writing assistant, a 100-point ATS checker and a PDF editor. Free daily plan, lifetime access for PKR 99.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Interface typefaces -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&display=swap">
  <!-- Resume template typefaces (font files are only downloaded when a template uses them) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Open+Sans:wght@400;600;700&family=Montserrat:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Raleway:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;600;700&family=EB+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=block">
  <script>
    // Apply the saved theme before the first paint (no light/dark flash).
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('rs_theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f6fc' : '#07060e');
    })();
  </script>
  <style>
    /* Boot splash — shown until Angular renders the first route. */
    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #07060e; overflow: hidden; }
    [data-theme='light'] .boot { background: #f7f6fc; }
    .boot::before, .boot::after { content: ''; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(80px); opacity: .55; animation: boot-blob 6s ease-in-out infinite alternate; }
    .boot::before { top: -30vmax; left: -20vmax; background: radial-gradient(circle, rgba(99,102,241,.55), transparent 65%); }
    .boot::after { bottom: -30vmax; right: -20vmax; background: radial-gradient(circle, rgba(217,70,239,.4), transparent 65%); animation-delay: -3s; }
    .boot-mark { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #8b5cf6 35%, #d946ef 70%, #f472b6); box-shadow: 0 20px 60px -12px rgba(139,92,246,.8); animation: boot-pulse 1.6s ease-in-out infinite; }
    .boot-mark svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .boot-bar { position: absolute; z-index: 1; top: calc(50% + 58px); width: 120px; height: 3px; border-radius: 3px; background: rgba(139,92,246,.18); overflow: hidden; }
    .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #6366f1, #d946ef); animation: boot-load 1.1s ease-in-out infinite; }
    @keyframes boot-pulse { 50% { transform: scale(1.08) rotate(-4deg); } }
    @keyframes boot-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @keyframes boot-blob { to { transform: translate(8vmax, 6vmax) scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .boot *, .boot::before, .boot::after { animation: none !important; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot" aria-label="Loading ResumeStudio">
      <div class="boot-mark"><svg viewBox="0 0 24 24"><path d="M7 3.5h7.5L19 8v12.5H7z" /><path d="M14.5 3.5V8H19" /><path d="M10 12.5h6M10 16h4" /></svg></div>
      <div class="boot-bar"></div>
    </div>
  </app-root>
</body>
</html>
