<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>ResumeStudio — AI Resume Builder, ATS Checker & PDF Editor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build ATS-friendly resumes with AI, choose from 4,600+ professional templates, check your ATS score and edit PDFs, images and Word documents online. Free daily plan, lifetime access for PKR 99.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c10">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ResumeStudio">
  <meta property="og:title" content="ResumeStudio — AI Resume Builder, ATS Checker & PDF Editor">
  <meta property="og:description" content="4,608 ATS-friendly templates, an AI writing assistant, a 100-point ATS checker and a PDF editor. Free daily plan, lifetime access for PKR 99.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Interface fonts and the icon font are self-hosted (npm run fonts); resume template
       fonts load on demand from Google Fonts, so warm up that connection early. -->
  <!-- fonts:preload -->
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin-A389D97D.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/material-symbols-23B04D9D.woff2" as="font" type="font/woff2" crossorigin>
  <!-- /fonts:preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Theme and performance tier are applied before the first paint (no flash, no wasted frames).
    // data-perf="lite" switches off glass blur, glow layers and looping decoration (see styles.scss)
    // on touch screens, low-memory or few-core devices, Data Saver, 2G and "reduce motion".
    // Overrides: ?perf=lite or ?perf=full (remembered); PerfService may also downgrade a janky device.
    (function () {
      var root = document.documentElement;
      var theme = 'dark';
      var perf = null;
      try {
        var saved = localStorage.getItem('rs_theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        var forced = /[?&]perf=(lite|full)\b/.exec(location.search);
        if (forced) localStorage.setItem('rs_perf', forced[1]);
        perf = localStorage.getItem('rs_perf') || localStorage.getItem('rs_perf_auto');
      } catch (e) {}
      if (perf !== 'lite' && perf !== 'full') {
        var nav = navigator;
        var conn = nav.connection || {};
        var mq = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
        var weak =
          mq('(hover: none) and (pointer: coarse)') ||
          mq('(prefers-reduced-motion: reduce)') ||
          (nav.deviceMemory > 0 && nav.deviceMemory <= 4) ||
          (nav.hardwareConcurrency > 0 && nav.hardwareConcurrency <= 4) ||
          conn.saveData === true ||
          /2g/.test(conn.effectiveType || '');
        perf = weak ? 'lite' : 'full';
      }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-perf', perf);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f8fa' : '#0a0c10');
    })();
  </script>
  <style>
    /* Boot splash — shown until Angular renders the first route. Transform-only animation. */
    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0a0c10; }
    [data-theme='light'] .boot { background: #f7f8fa; }
    .boot-mark { width: 64px; height: 64px; animation: boot-pulse 1.6s ease-in-out infinite; }
    .boot-bar { position: absolute; top: calc(50% + 58px); width: 120px; height: 3px; border-radius: 3px; background: rgba(37, 99, 235, 0.18); overflow: hidden; }
    .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #2563eb; animation: boot-load 1.1s ease-in-out infinite; }
    @keyframes boot-pulse { 50% { transform: scale(1.06); } }
    @keyframes boot-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .boot * , .boot-bar::after { animation: none !important; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot" aria-label="Loading ResumeStudio">
      <!-- Brand mark (source: scripts/app-icons.mjs) -->
      <svg class="boot-mark" viewBox="0 0 32 32"><path d="M6.5 0H22.5L32 9.5V25.5A6.5 6.5 0 0 1 25.5 32H6.5A6.5 6.5 0 0 1 0 25.5V6.5A6.5 6.5 0 0 1 6.5 0Z" fill="#2563EB" /><path d="M22.5 0V7.5A2 2 0 0 0 24.5 9.5H32Z" fill="#BFD4FF" /><path d="M10.5 24.5V8.5H16.2A4.4 4.4 0 0 1 16.2 17.3H10.5M15.8 17.3L21.3 24.5" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <div class="boot-bar"></div>
    </div>
  </app-root>
</body>
</html>
