<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update needed — ResumeStudio</title>
  <!-- Shown by the Android app (capacitor.config.ts → server.errorPath) when the phone's web engine
       is too old to run it. Plain HTML/CSS only: no script may rely on a modern browser here. -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      background: #0a0c10; color: #f3f5f8; font-family: Roboto, Arial, sans-serif; text-align: center; }
    .box { max-width: 380px; }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: #2563eb; margin: 0 auto 18px; }
    h1 { font-size: 21px; margin: 0 0 10px; }
    p { color: #a3acb9; font-size: 15px; line-height: 1.55; margin: 0 0 16px; }
    a { display: block; margin: 10px 0; padding: 13px 16px; border-radius: 10px; background: #2563eb; color: #fff; text-decoration: none; font-weight: bold; }
    a.alt { background: #222731; }
    small { color: #6b7482; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark"></div>
    <h1>One quick update needed</h1>
    <p>ResumeStudio needs a newer version of your phone's web engine. Update <b>Android System WebView</b> (or Google Chrome) from the Play Store, then open the app again.</p>
    <a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Update Android System WebView</a>
    <a class="alt" href="https://play.google.com/store/apps/details?id=com.android.chrome">Update Google Chrome</a>
    <small>Updates are free and usually take less than a minute.</small>
  </div>
</body>
</html>
