# ResumeStudio — production stack for a VPS (e.g. Hostinger KVM).
#   api : NestJS backend (+ Chromium for PDF export), connects to Supabase PostgreSQL
#   web : Caddy — serves the Angular app, proxies /api to the backend, automatic HTTPS
#
# Usage (from this folder):
#   cp .env.example .env   # then fill it in (with your Supabase DATABASE_URL)
#   docker compose up -d --build

name: resumestudio

services:
  api:
    build: ../backend
    restart: unless-stopped
    # Everything in .env (JWT_SECRET, ANTHROPIC_API_KEY, PAYMENT_*, ADMIN_EMAILS, …) reaches the API.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env}
      FRONTEND_URL: https://${DOMAIN}
      TRUST_PROXY: 1
      UPLOAD_DIR: /data/uploads
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - uploads:/data/uploads
    shm_size: 1gb

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  uploads:
  caddy_data:
  caddy_config:
