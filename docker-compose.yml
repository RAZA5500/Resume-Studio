# NOTE: The database is now hosted on Supabase (cloud PostgreSQL).
# This local docker-compose is an optional offline fallback only.
services:
  postgres:
    image: postgres:17-alpine
    container_name: resumestudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumestudio
      POSTGRES_PASSWORD: resumestudio_secret
      POSTGRES_DB: resumestudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumestudio -d resumestudio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
